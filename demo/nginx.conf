# RMT control center -- test/evaluation only (see demo/README.md).
#
# The SPA fetches /config from its own origin (src/config/runtime.ts), then calls
# the backend directly on http://<hostname>:<api_port>. So only /config is
# proxied here; every other API call goes browser -> backend, subject to the
# backend's RMT_CORS_ORIGINS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /config {
        proxy_pass http://backend:8000/config;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
