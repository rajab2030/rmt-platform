# RMT-CAP-13 -- Evidence-Grounded Incident Explainer (slice 1), plus the
# read-only evidence lookup it depends on and the shared local LLM settings.
#
# RMT_REASONING_ENABLED     /ops/reasoning/* (explain + list). Read-only with
#                           respect to governance: the model only explains
#                           recorded evidence; every claim must cite it or is
#                           dropped. Writes only to its own reasoning.db.
# RMT_OPS_EVIDENCE_ENABLED  RMT-CAP-09 GET /ops/evidence. The console's
#                           Explain panel appears only after an evidence
#                           lookup, so CAP-13 is unusable without it.
#
# The LLM settings below are SHARED with CAP-05 5B (app.agent.loop_config):
# changing them also changes the /agent/act/llm agent. The code default
# deepseek-v4-flash:cloud was retired by ollama.com (HTTP 410, 2026-09-25);
# qwen2.5:3b is the local model (CPU, ~45-60s per explanation on this host),
# so the token budget and timeout are raised from the 400 / 60s defaults.
#
# Install:
#   sudo install -m 0644 deploy/systemd/cap13-reasoning.conf \
#     /etc/systemd/system/rmt-control-center.service.d/cap13-reasoning.conf
#   sudo systemctl daemon-reload && sudo systemctl restart rmt-control-center.service
#
# Roll back: remove the installed file, daemon-reload, restart.
#
# See docs/RMT_CAP_13_PROPOSAL.md and docs/operations/CONFIG.md.

[Service]
Environment=RMT_REASONING_ENABLED=true
Environment=RMT_OPS_EVIDENCE_ENABLED=true
Environment=RMT_AGENT_LLM_MODEL=qwen2.5:3b
Environment=RMT_AGENT_LLM_MAX_TOKENS=1500
Environment=RMT_AGENT_LLM_TIMEOUT_SECONDS=180
