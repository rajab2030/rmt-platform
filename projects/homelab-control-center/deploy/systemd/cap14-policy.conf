# RMT-CAP-14 (P-A) -- load the homelab remediation policy from a file.
#
# Without this drop-in the backend uses the built-in policy in
# app/homelab/remediation.py. With it, the TOML file below REPLACES the
# built-in policy. An invalid file stops the backend from starting
# (fail-closed), so always check the file first.
#
# Install:
#   sudo install -d -m 0755 /etc/rmt-platform
#   sudo install -m 0644 deploy/remediation_policy.example.toml \
#     /etc/rmt-platform/remediation_policy.toml              # then edit
#   backend/.venv/bin/python backend/scripts/rmt-policy-check.py \
#     /etc/rmt-platform/remediation_policy.toml        # must print VALID
#   sudo install -m 0644 deploy/systemd/cap14-policy.conf \
#     /etc/systemd/system/rmt-control-center.service.d/cap14-policy.conf
#   sudo systemctl daemon-reload && sudo systemctl restart rmt-control-center.service
#
# Not /etc/rmt-control-center/: that directory is root-only (0700) secrets
# storage and the service user (rmt-lab) cannot read it. The policy is not
# secret; root-owned + world-readable is the intended mode.
#
# Every later policy edit: run the checker, then restart. Confirm with
# GET /homelab/loop/status -> policy_source (source "file" + sha256).
#
# Roll back: remove this drop-in, daemon-reload, restart (built-in policy).
#
# See docs/RMT_CAP_14_PROPOSAL.md and deploy/remediation_policy.example.toml.

[Service]
Environment=RMT_HOMELAB_REMEDIATION_POLICY_FILE=/etc/rmt-platform/remediation_policy.toml
