# production-readiness D3 -- service hardening for rmt-control-center.
#
# Sandboxing + resource ceilings + restart backoff for the RMT backend unit.
# The service already runs as a non-root user (User=rmt-lab); this adds the
# systemd confinement that unit had none of.
#
# Install:
#   sudo install -m 0644 projects/homelab-control-center/deploy/systemd/hardening.conf \
#     /etc/systemd/system/rmt-control-center.service.d/hardening.conf
#   sudo systemctl daemon-reload && sudo systemctl restart rmt-control-center.service
#
# Verify (watch the FIRST restart):
#   systemctl is-active rmt-control-center.service            # active
#   curl -sk https://<host>/health | jq .status              # "ok"
#   journalctl -u rmt-control-center.service -n 50 --no-pager # no EPERM / traceback
#   systemd-analyze security rmt-control-center.service       # score should fall well below 9.2
#   # exercise the Docker path once (agent OFF by default): a read-only call
#   curl -sk https://<host>/homelab/loop/status -H "X-API-Key: <token>" | jq .running
#
# Rollback:
#   sudo rm /etc/systemd/system/rmt-control-center.service.d/hardening.conf
#   sudo systemctl daemon-reload && sudo systemctl restart rmt-control-center.service
#
# Notes / deliberate non-settings:
#   * ProtectHome stays `no` and ProtectSystem is `full` (not `strict`): the
#     evidence JSON stores live inside the package tree
#     (app/core/intelligence/**/*.json) and data/observability.db sits under
#     WorkingDirectory -- both under /home. Moving to `strict` needs
#     ReadWritePaths=/home/rmt-lab/homelab/projects/homelab-control-center/backend
#     -- do that as a follow-up once verified on a watched restart.
#   * Docker socket access is via the `docker` supplementary group, which
#     NoNewPrivileges does not drop -- the AF_UNIX connection keeps working.
#   * MemoryDenyWriteExecute is intentionally NOT set (CPython / native ext
#     trampolines can need W|X).
#   * No IPAddressAllow/Deny yet: RMT_NOTIFY_WEBHOOK_URL (O2/O3) may point
#     off-box later; add localhost-only filtering when that sink is decided.

[Unit]
# Restart backoff -- a crash loop must not hammer the Docker socket or journald.
# >5 starts within 300s => the unit stops retrying and goes `failed`
# (clear with: systemctl reset-failed rmt-control-center.service).
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
Restart=always
RestartSec=5
RestartSteps=5
RestartMaxDelaySec=60

# --- resource ceilings (idle RSS ~70M, ~7 tasks; generous headroom) ---
MemoryHigh=384M
MemoryMax=512M
CPUQuota=200%
TasksMax=128

# --- privilege & exec hygiene ---
NoNewPrivileges=yes
LockPersonality=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
RestrictNamespaces=yes
RemoveIPC=yes
UMask=0077

# --- filesystem ---
ProtectSystem=full
ProtectHome=no
PrivateTmp=yes

# --- kernel / process surface (no psutil, no /proc reads in the app) ---
ProtectControlGroups=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible

# --- syscall / socket surface ---
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
