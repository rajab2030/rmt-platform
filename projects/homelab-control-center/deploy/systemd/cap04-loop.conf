# CAP-04 -- Continuous Homelab Operational Loop.
#
# Enables the supervised, periodic Understand -> Decide -> Govern -> Authorize
# -> Execute -> Verify -> Learn loop over the real homelab. Disabled in code by
# default; this drop-in is what turns it on for the live deployment.
#
# Install:
#   sudo install -m 0644 deploy/systemd/cap04-loop.conf \
#     /etc/systemd/system/rmt-control-center.service.d/cap04-loop.conf
#   sudo systemctl daemon-reload && sudo systemctl restart rmt-control-center.service
#
# Also toggleable at runtime: POST /homelab/loop/start | /homelab/loop/stop
# (authenticated). See docs/operations/CONFIG.md.

[Service]
Environment=RMT_HOMELAB_LOOP_ENABLED=true
