# CAP-05 (5A + 5B) -- governed agent surface.
#
# 5A: the /agent/* surface other agents call to get a consequential action
#     governed (propose -> hold -> human approve -> execute -> verified result).
# 5B: the LLM-backed agent path (/agent/act/llm).
#
# Both are disabled in code by default; this drop-in enables them on the live
# deployment. The agent only ever *proposes*; every risky action still holds for
# a human. Scoped / time-limited / single-use authority grants apply.
#
# Install:
#   sudo install -m 0644 deploy/systemd/cap05-agent.conf \
#     /etc/systemd/system/rmt-control-center.service.d/cap05-agent.conf
#   sudo systemctl daemon-reload && sudo systemctl restart rmt-control-center.service
#
# See docs/operations/CONFIG.md and docs/RMT_CAP_05_PROPOSAL.md.

[Service]
Environment=RMT_AGENT_ENABLED=true
Environment=RMT_AGENT_LLM_ENABLED=true
