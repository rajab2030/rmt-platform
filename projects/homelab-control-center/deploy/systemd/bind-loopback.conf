# production-readiness S4 -- bind the RMT app to loopback only.
# The Caddy reverse proxy (deploy/Caddyfile) is the only LAN-facing listener.
#
# Install:
#   sudo install -m 0644 deploy/systemd/bind-loopback.conf \
#     /etc/systemd/system/rmt-control-center.service.d/bind-loopback.conf
#   sudo systemctl daemon-reload && sudo systemctl restart rmt-control-center.service
#
# The empty ExecStart= clears the base unit's value before the override.

[Service]
ExecStart=
ExecStart=/home/rmt-lab/homelab/projects/homelab-control-center/backend/.venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000
